upstream docker_api {
    server unix:/var/run/docker.sock;
}

server {
    listen 2375;
    server_name _;

    proxy_http_version 1.1;
    proxy_request_buffering off;
    proxy_buffering off;

    location ~ ^/(?:v[0-9.]+/)?(?:_ping|version)$ {
        limit_except GET {
            deny all;
        }
        proxy_pass http://docker_api;
    }

    location ~ ^/(?:v[0-9.]+/)?containers/json$ {
        limit_except GET {
            deny all;
        }
        proxy_pass http://docker_api;
    }

    location ~ ^/(?:v[0-9.]+/)?containers/[^/]+/(?:json|logs|stats)$ {
        limit_except GET {
            deny all;
        }
        proxy_pass http://docker_api;
    }

    location ~ ^/(?:v[0-9.]+/)?containers/[^/]+/restart$ {
        limit_except POST {
            deny all;
        }
        proxy_pass http://docker_api;
    }

    location / {
        return 403;
    }
}
