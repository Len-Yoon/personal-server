apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-lab-datasource
  namespace: monitoring
  labels:
    grafana_datasource: "1"
data:
  loki-lab-datasource.yaml: |
    apiVersion: 1
    prune: true
    datasources:
      - name: Loki Lab
        uid: loki-lab
        type: loki
        access: proxy
        url: http://loki-lab.observability-lab.svc.cluster.local:3100
        isDefault: false
        editable: false
