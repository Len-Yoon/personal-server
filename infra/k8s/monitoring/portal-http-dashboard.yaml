apiVersion: v1
kind: ConfigMap
metadata:
  name: portal-http-observability
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  portal-http-observability.json: |
    {
      "annotations": {"list": []},
      "editable": false,
      "panels": [
        {
          "datasource": "Prometheus",
          "fieldConfig": {"defaults": {"unit": "short"}, "overrides": []},
          "gridPos": {"h": 8, "w": 6, "x": 0, "y": 0},
          "id": 1,
          "options": {"colorMode": "value", "graphMode": "area", "reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}},
          "targets": [{"datasource": "Prometheus", "expr": "sum(increase(portal_http_requests_total[5m]))", "refId": "A"}],
          "title": "최근 5분 요청 수",
          "type": "stat"
        },
        {
          "datasource": "Prometheus",
          "fieldConfig": {"defaults": {"unit": "short"}, "overrides": []},
          "gridPos": {"h": 8, "w": 6, "x": 6, "y": 0},
          "id": 2,
          "legend": {"displayMode": "list", "placement": "bottom", "showLegend": true},
          "targets": [{"datasource": "Prometheus", "expr": "sum by (status_code) (increase(portal_http_requests_total[5m]))", "legendFormat": "{{status_code}}", "refId": "A"}],
          "title": "상태 코드별 요청 수",
          "type": "timeseries"
        },
        {
          "datasource": "Prometheus",
          "fieldConfig": {"defaults": {"decimals": 2, "unit": "percentunit"}, "overrides": []},
          "gridPos": {"h": 8, "w": 6, "x": 12, "y": 0},
          "id": 3,
          "options": {"colorMode": "value", "graphMode": "area", "reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}},
          "targets": [{"datasource": "Prometheus", "expr": "(sum(rate(portal_http_requests_total{status_code=~\"5..\"}[5m])) / clamp_min(sum(rate(portal_http_requests_total[5m])), 1)) or vector(0)", "refId": "A"}],
          "title": "5xx 오류 비율",
          "type": "stat"
        },
        {
          "datasource": "Prometheus",
          "fieldConfig": {"defaults": {"decimals": 3, "unit": "s"}, "overrides": []},
          "gridPos": {"h": 8, "w": 6, "x": 18, "y": 0},
          "id": 4,
          "options": {"colorMode": "value", "graphMode": "area", "reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}},
          "targets": [{"datasource": "Prometheus", "expr": "histogram_quantile(0.95, sum by (le) (rate(portal_http_request_duration_seconds_bucket[5m])))", "refId": "A"}],
          "title": "p95 응답 시간",
          "type": "stat"
        }
      ],
      "schemaVersion": 39,
      "tags": ["portal", "http", "observability"],
      "templating": {"list": []},
      "time": {"from": "now-6h", "to": "now"},
      "timezone": "browser",
      "title": "Portal HTTP 관측성",
      "uid": "portal-http-observability",
      "version": 1
    }
