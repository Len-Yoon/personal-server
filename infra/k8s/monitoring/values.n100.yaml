alertmanager:
  enabled: false

# WSL2 CPU/memory collection needs only read-only /proc and /sys, not host root.
nodeExporter:
  enabled: true

prometheus-node-exporter:
  hostRootFsMount:
    enabled: false
  hostNetwork: false
  hostPID: false
  extraArgs:
    - --collector.disable-defaults
    - --collector.cpu
    - --collector.meminfo
  image:
    # Official development image pinned by digest; not a stable release.
    # The chart appends -distroless to this tag.
    tag: master
    digest: sha256:2aeca551ca3cb8c90f11fee9bcdf9859725c48f272d478aa79b9bbc48eda13ed
  containerSecurityContext:
    readOnlyRootFilesystem: true
    runAsNonRoot: true
    allowPrivilegeEscalation: false
    capabilities:
      drop: [ALL]
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 64Mi

defaultRules:
  rules:
    nodeExporterAlerting: false
    nodeExporterRecording: false
  # K3s does not expose these control-plane targets for discovery.
  disabled:
    KubeControllerManagerDown: true
    KubeSchedulerDown: true
    KubeProxyDown: true

grafana:
  sidecar:
    datasources:
      enabled: true
      label: grafana_datasource
      labelValue: "1"
  service:
    type: ClusterIP
  ingress:
    enabled: false
  persistence:
    enabled: true
    storageClassName: local-path
    size: 1Gi
    annotations:
      helm.sh/resource-policy: keep
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

prometheus:
  prometheusSpec:
    retention: 7d
    # A 3Gi retention target leaves 2Gi headroom for WAL/head/compaction.
    # local-path requests do not enforce a host filesystem quota.
    retentionSize: 3GB
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        cpu: 1
        memory: 1Gi
    storageSpec:
      volumeClaimTemplate:
        metadata:
          annotations:
            helm.sh/resource-policy: keep
        spec:
          storageClassName: local-path
          accessModes: [ReadWriteOnce]
          resources:
            requests:
              storage: 5Gi

kube-state-metrics:
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi
