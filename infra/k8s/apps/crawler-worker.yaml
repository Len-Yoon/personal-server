apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: crawler-worker-data
  namespace: personal-server
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: crawler-worker
  namespace: personal-server
  labels:
    app.kubernetes.io/name: crawler-worker
spec:
  # This manifest is intentionally inert. crawler-worker-prepare.sh replaces the
  # sentinel with an imported immutable digest, while preserving replica 0.
  replicas: 0
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: crawler-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: crawler-worker
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: crawler-worker
          image: personal-server-crawler-worker:unconfigured-do-not-run
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8001
          envFrom:
            - secretRef:
                name: crawler-worker-runtime
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          readinessProbe:
            httpGet:
              path: /health
              port: http
          livenessProbe:
            httpGet:
              path: /health
              port: http
          volumeMounts:
            - name: crawler-worker-data
              mountPath: /data/crawler-worker
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: crawler-worker-data
          persistentVolumeClaim:
            claimName: crawler-worker-data
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: crawler-worker
  namespace: personal-server
  labels:
    app.kubernetes.io/name: crawler-worker
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: crawler-worker
  ports:
    - name: http
      port: 8001
      targetPort: http
