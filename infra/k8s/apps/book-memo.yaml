apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: book-memo-data
  namespace: personal-server
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: book-memo
  namespace: personal-server
  labels:
    app.kubernetes.io/name: book-memo
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: book-memo
  template:
    metadata:
      labels:
        app.kubernetes.io/name: book-memo
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: book-memo
          image: personal-server-book-memo:v1
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8003
          envFrom:
            - secretRef:
                name: book-memo-runtime
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          readinessProbe:
            httpGet:
              path: /health
              port: http
          livenessProbe:
            httpGet:
              path: /health
              port: http
          volumeMounts:
            - name: book-memo-data
              mountPath: /data/book-memo
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: book-memo-data
          persistentVolumeClaim:
            claimName: book-memo-data
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: book-memo
  namespace: personal-server
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: book-memo
  ports:
    - name: http
      port: 8003
      targetPort: http
