apiVersion: v1
kind: ServiceAccount
metadata:
  name: n100-ha-writer-observer
  namespace: personal-server
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: n100-ha-writer-observer
  namespace: personal-server
rules:
  - apiGroups: [apps]
    resources: [deployments, replicasets]
    verbs: [list]
  - apiGroups: [batch]
    resources: [cronjobs, jobs]
    verbs: [list]
  - apiGroups: [""]
    resources: [pods]
    verbs: [list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: n100-ha-writer-observer
  namespace: personal-server
subjects:
  - kind: ServiceAccount
    name: n100-ha-writer-observer
    namespace: personal-server
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: n100-ha-writer-observer
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: n100-ha-writer-observer-hpa
rules:
  - apiGroups: [autoscaling]
    resources: [horizontalpodautoscalers]
    verbs: [list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: n100-ha-writer-observer-hpa
subjects:
  - kind: ServiceAccount
    name: n100-ha-writer-observer
    namespace: personal-server
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: n100-ha-writer-observer-hpa
