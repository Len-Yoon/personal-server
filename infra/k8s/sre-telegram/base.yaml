apiVersion: v1
kind: ConfigMap
metadata:
  name: sre-telegram-relay-state
  namespace: monitoring
data: {}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sre-telegram-relay
  namespace: monitoring
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: sre-telegram-relay-node-reader
rules:
  - apiGroups: [""]
    resources: [nodes]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: sre-telegram-relay-workload-reader
rules:
  - apiGroups: [""]
    resources: [pods, persistentvolumeclaims]
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: sre-telegram-relay-state
  namespace: monitoring
rules:
  - apiGroups: [""]
    resources: [configmaps]
    resourceNames: [sre-telegram-relay-state]
    verbs: [get, update, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: sre-telegram-relay-node-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: sre-telegram-relay-node-reader
subjects:
  - kind: ServiceAccount
    name: sre-telegram-relay
    namespace: monitoring
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: sre-telegram-relay-workload-reader
  namespace: monitoring
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: sre-telegram-relay-workload-reader
subjects:
  - kind: ServiceAccount
    name: sre-telegram-relay
    namespace: monitoring
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: sre-telegram-relay-workload-reader
  namespace: personal-server
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: sre-telegram-relay-workload-reader
subjects:
  - kind: ServiceAccount
    name: sre-telegram-relay
    namespace: monitoring
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: sre-telegram-relay-state
  namespace: monitoring
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: sre-telegram-relay-state
subjects:
  - kind: ServiceAccount
    name: sre-telegram-relay
    namespace: monitoring
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sre-telegram-relay
  namespace: monitoring
  labels:
    app.kubernetes.io/name: sre-telegram-relay
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: sre-telegram-relay
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sre-telegram-relay
    spec:
      serviceAccountName: sre-telegram-relay
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: relay
          image: personal-server-sre-telegram-relay:latest
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: TELEGRAM_BOT_TOKEN_FILE
              value: /var/run/sre-telegram-relay/telegram_bot_token
            - name: ALLOWED_CHAT_ID_FILE
              value: /var/run/sre-telegram-relay/allowed_chat_id
            - name: ALERTMANAGER_AUTH_TOKEN_FILE
              value: /var/run/sre-telegram-relay/alertmanager_auth_token
          volumeMounts:
            - name: relay-runtime
              mountPath: /var/run/sre-telegram-relay
              readOnly: true
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
      volumes:
        - name: relay-runtime
          secret:
            secretName: sre-telegram-relay-runtime
            defaultMode: 0444
            items:
              - key: telegram_bot_token
                path: telegram_bot_token
              - key: allowed_chat_id
                path: allowed_chat_id
              - key: alertmanager_auth_token
                path: alertmanager_auth_token
---
apiVersion: v1
kind: Service
metadata:
  name: sre-telegram-relay
  namespace: monitoring
  labels:
    app.kubernetes.io/name: sre-telegram-relay
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: sre-telegram-relay
  ports:
    - name: http
      port: 8080
      targetPort: http
