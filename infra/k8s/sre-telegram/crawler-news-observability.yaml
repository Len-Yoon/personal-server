apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: crawler-news-observability
  namespace: monitoring
  labels:
    release: personal-server-monitoring
spec:
  serviceDiscoveryRole: EndpointSlice
  namespaceSelector:
    matchNames:
      - personal-server
  selector:
    matchLabels:
      app.kubernetes.io/name: crawler-worker
  endpoints:
    - port: http
      path: /internal/metrics
      interval: 30s
      bearerTokenSecret:
        name: crawler-news-metrics
        key: bearer_token
