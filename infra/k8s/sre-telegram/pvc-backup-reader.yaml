# Apply separately from base.yaml; this grants read access without touching relay state.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: sre-telegram-pvc-backup-reader
  namespace: personal-server
rules:
  - apiGroups: [""]
    resources: [configmaps]
    resourceNames: [book-pvc-backup-state, youtube-pvc-backup-state, crawler-pvc-backup-state]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: sre-telegram-pvc-backup-reader
  namespace: personal-server
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: sre-telegram-pvc-backup-reader
subjects:
  - kind: ServiceAccount
    name: sre-telegram-relay
    namespace: monitoring
