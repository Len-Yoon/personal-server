apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: sre-telegram-k3s-alerts
  namespace: monitoring
  labels:
    release: personal-server-monitoring
spec:
  groups:
    - name: sre-telegram-k3s
      rules:
        - alert: PodRestartIncrease
          expr: increase(kube_pod_container_status_restarts_total{namespace=~"monitoring|personal-server"}[15m]) > 3
          labels:
            severity: warning
            sre_telegram: "true"
          annotations:
            summary: "Pod 재시작 급증"
            description: "컨테이너가 15분 동안 3회 초과 재시작됨"
        - alert: PortalUnavailable
          expr: (kube_deployment_spec_replicas{namespace="personal-server",deployment="portal-web"} > 0) and on(namespace,deployment) (kube_deployment_status_replicas_available{namespace="personal-server",deployment="portal-web"} == 0)
          for: 2m
          labels:
            severity: critical
            sre_telegram: "true"
          annotations:
            summary: "Portal 미가용"
            description: "K3s Portal이 2분 동안 Ready 상태가 아님"
        - alert: DeploymentUnavailable
          expr: kube_deployment_spec_replicas{namespace=~"monitoring|personal-server",deployment!="portal-web"} > kube_deployment_status_replicas_available{namespace=~"monitoring|personal-server",deployment!="portal-web"}
          for: 10m
          labels:
            severity: warning
            sre_telegram: "true"
          annotations:
            summary: "Deployment 미가용"
            description: "Deployment의 desired replica가 available replica보다 큼"
        - alert: PVCNotBound
          expr: kube_persistentvolumeclaim_status_phase{namespace=~"monitoring|personal-server",phase="Bound"} == 0
          for: 10m
          labels:
            severity: warning
            sre_telegram: "true"
          annotations:
            summary: "PVC 미바인딩"
            description: "PVC가 10분 동안 Bound 상태가 아님"
        - alert: PrometheusTargetDown
          expr: up == 0
          for: 5m
          labels:
            severity: warning
            sre_telegram: "true"
          annotations:
            summary: "Prometheus target down"
            description: "Prometheus scrape target이 5분 동안 UP이 아님"
        - alert: PortalHttp5xxErrorRateHigh
          expr: (sum(rate(portal_http_requests_total{status_code=~"5.."}[5m])) / clamp_min(sum(rate(portal_http_requests_total[5m])), 1)) > 0.01 and sum(rate(portal_http_requests_total[5m])) > 0.1
          for: 5m
          labels:
            severity: warning
            sre_telegram: "true"
          annotations:
            summary: "Portal HTTP 5xx 오류율 높음"
            description: "최근 5분 기준 5xx 비율이 1%를 초과했고 요청량이 충분한 상태가 5분 지속됨"
        - alert: PortalHttpP95LatencyHigh
          expr: histogram_quantile(0.95, sum by (le) (rate(portal_http_request_duration_seconds_bucket[5m]))) > 1
          for: 5m
          labels:
            severity: warning
            sre_telegram: "true"
          annotations:
            summary: "Portal HTTP p95 응답 지연"
            description: "최근 5분 기준 Portal HTTP p95 응답 시간이 1초를 초과한 상태가 5분 지속됨"
        - alert: NewsCollectionStale
          expr: >-
            crawler_news_collection_initialized == 1 and (
              crawler_news_collection_consecutive_failures >= 3
              or (
                time() - crawler_news_collection_first_attempt_timestamp_seconds > 1800
                and (
                  (crawler_news_collection_last_success_timestamp_seconds > 0
                   and time() - crawler_news_collection_last_success_timestamp_seconds > 1800)
                  or
                  (crawler_news_collection_last_success_timestamp_seconds == 0
                   and time() - crawler_news_collection_last_attempt_timestamp_seconds > 1800)
                )
              )
            )
          for: 0m
          labels:
            severity: warning
            sre_telegram: "true"
          annotations:
            summary: "뉴스 수집 지연 또는 연속 실패"
            description: "뉴스 수집이 최근 30분 동안 성공하지 않았거나 3회 연속 실패함"
