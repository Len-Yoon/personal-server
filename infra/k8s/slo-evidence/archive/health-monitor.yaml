# Preparation only. Replace pending with an independently verified immutable
# archive image before approved installation. Never apply to the collector.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: slo-observation-health
  namespace: monitoring
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: slo-observation-health
  template:
    metadata:
      labels:
        app.kubernetes.io/name: slo-observation-health
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/arch: amd64
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: health
          image: personal-server-slo-observation-archive:pending
          imagePullPolicy: Never
          command: [python3, -B, /opt/observations/slo-observation-health.py]
          args: [--directory, /archive/observations, --required-from, pending]
          ports:
            - name: metrics
              containerPort: 9091
          readinessProbe:
            httpGet: {path: /ready, port: metrics}
            timeoutSeconds: 5
          livenessProbe:
            httpGet: {path: /health, port: metrics}
            timeoutSeconds: 5
            initialDelaySeconds: 10
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: 500m, memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: archive
              mountPath: /archive
              readOnly: true
      volumes:
        - name: archive
          persistentVolumeClaim:
            claimName: slo-observation-archive
            readOnly: true
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: slo-observation-health
  namespace: monitoring
  labels:
    release: personal-server-monitoring
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: slo-observation-health
  podMetricsEndpoints:
    - port: metrics
      path: /metrics
      interval: 60s
      scrapeTimeout: 5s
      relabelings:
        - targetLabel: component
          replacement: slo-observation-health
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: slo-observation-health
  namespace: monitoring
  labels:
    release: personal-server-monitoring
spec:
  groups:
    - name: slo-observation-health
      rules:
        - alert: ObservationArchiveScrapeMissing
          expr: >-
            (kube_deployment_spec_replicas{namespace="monitoring",deployment="slo-observation-health"} > 0)
            unless on(namespace) up{namespace="monitoring",component="slo-observation-health"}
          for: 10m
          labels:
            severity: warning
            sre_telegram: "true"
          annotations:
            summary: "관측 보존 검증기의 수집 연결 누락"
            description: "검증기 Deployment가 요구되지만 Prometheus 수집 대상이 10분 동안 없음. 이미 존재하는 target의 DOWN은 기존 공통 알림에서 처리함."
        - alert: ObservationArchiveVerificationUnhealthy
          expr: >-
            (slo_observation_archive_verification_success == 0)
            or (time() - slo_observation_archive_last_verified_timestamp_seconds > 900)
          for: 10m
          labels:
            severity: warning
            sre_telegram: "true"
          annotations:
            summary: "관측 보존 파일 검증 실패 또는 지연"
            description: "읽기 전용 무결성 검증이 실패했거나 최근 성공이 15분보다 오래된 상태가 10분 지속됨. 잠금 경합은 별도 지표로 구분함."
        - alert: ObservationArchiveDayMissing
          expr: >-
            (slo_observation_archive_missing_required_days > 0)
            and on(namespace,pod) (slo_observation_archive_verification_success == 1)
          for: 15m
          labels:
            severity: warning
            sre_telegram: "true"
          annotations:
            summary: "보존 의무 일자의 관측 파일 누락"
            description: "고정 시작일 이후 최대 35일에서 누락된 파일 또는 지연 허용 후 전일 파일 부재를 15분 확인함. 09:10 KST 수집에 09:45까지 허용하며 시작 전 미보유 기간을 실패로 채우지 않음."
        - alert: ObservationArchiveQuotaNearFull
          expr: slo_observation_archive_stored_bytes / slo_observation_archive_quota_bytes > 0.90
          for: 10m
          labels:
            severity: warning
            sre_telegram: "true"
          annotations:
            summary: "관측 보존 도구의 논리 용량 한도 임박"
            description: "검증된 파일 크기가 도구의 384MiB 논리 한도 중 90%를 초과함. 기존 PVC 물리 공간 부족 알림과 구분함."
