---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: quarterly-sre-audit
  namespace: monitoring
spec:
  schedule: "30 3 1 1,4,7,10 *"
  timeZone: Asia/Seoul
  suspend: true
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 1200
      ttlSecondsAfterFinished: 86400
      template:
        spec:
          serviceAccountName: quarterly-sre-audit
          restartPolicy: Never
          automountServiceAccountToken: true
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: audit
              image: personal-server-quarterly-sre-audit:task1
              imagePullPolicy: Never
              securityContext:
                runAsNonRoot: true
                readOnlyRootFilesystem: true
                allowPrivilegeEscalation: false
                capabilities:
                  drop: [ALL]
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  cpu: 250m
                  memory: 256Mi
              volumeMounts:
                - name: temporary
                  mountPath: /tmp
          volumes:
            - name: temporary
              emptyDir:
                sizeLimit: 16Mi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: quarterly-sre-audit-validation
  namespace: monitoring
spec:
  schedule: "30 3 1 1,4,7,10 *"
  timeZone: Asia/Seoul
  suspend: true
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 1200
      ttlSecondsAfterFinished: 86400
      template:
        spec:
          serviceAccountName: quarterly-sre-audit-validation
          restartPolicy: Never
          automountServiceAccountToken: true
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: audit
              image: personal-server-quarterly-sre-audit:task1
              imagePullPolicy: Never
              env:
                - name: QUARTERLY_SRE_AUDIT_REPORT_MODE
                  value: validation
                - name: QUARTERLY_SRE_AUDIT_DIAGNOSTICS_CONFIGMAP
                  value: sre-quarterly-audit-diagnostics
              securityContext:
                runAsNonRoot: true
                readOnlyRootFilesystem: true
                allowPrivilegeEscalation: false
                capabilities:
                  drop: [ALL]
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  cpu: 250m
                  memory: 256Mi
              volumeMounts:
                - name: temporary
                  mountPath: /tmp
          volumes:
            - name: temporary
              emptyDir:
                sizeLimit: 16Mi
