apiVersion: v1
kind: Namespace
metadata:
  name: sre-recovery-lab
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/audit-version: latest
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/warn-version: latest
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sre-pod-recovery
  namespace: sre-recovery-lab
spec:
  replicas: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: sre-pod-recovery
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sre-pod-recovery
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: recovery
          image: busybox@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662
          command:
            - sh
            - -c
            - |
              touch /tmp/healthy || exit 1
              while true; do
                if [ ! -f /tmp/recovery-fault-injected ] &&
                   [ "$(cat /var/run/recovery-trigger/trigger)" = true ]; then
                  touch /tmp/recovery-fault-injected && rm -f /tmp/healthy || exit 1
                fi
                sleep 1
              done
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: recovery-tmp
              mountPath: /tmp
            - name: recovery-trigger
              mountPath: /var/run/recovery-trigger
              readOnly: true
          livenessProbe:
            exec:
              command: ["sh", "-c", "test -f /tmp/healthy"]
            initialDelaySeconds: 2
            periodSeconds: 2
            failureThreshold: 1
          readinessProbe:
            exec:
              command: ["sh", "-c", "test -f /tmp/healthy"]
            initialDelaySeconds: 1
            periodSeconds: 2
      volumes:
        - name: recovery-tmp
          emptyDir:
            sizeLimit: 16Mi
        - name: recovery-trigger
          configMap:
            name: sre-pod-recovery-trigger
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: sre-pod-recovery-trigger
  namespace: sre-recovery-lab
data:
  trigger: "false"
---
apiVersion: v1
