apiVersion: v1
kind: ServiceAccount
metadata:
  name: portal-pvc-backup
  namespace: personal-server
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: portal-pvc-backup
  namespace: personal-server
rules:
  - apiGroups: [""]
    resources: [persistentvolumeclaims]
    resourceNames: [portal-web-files-dynamic, portal-web-state-dynamic]
    verbs: [get]
  - apiGroups: [apps]
    resources: [deployments]
    resourceNames: [portal-web]
    verbs: [get, watch]
  - apiGroups: [apps]
    resources: [deployments/scale]
    resourceNames: [portal-web]
    verbs: [get, patch]
  - apiGroups: [""]
    resources: [configmaps]
    resourceNames: [portal-pvc-backup-evidence]
    verbs: [get, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: portal-pvc-backup
  namespace: personal-server
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: portal-pvc-backup
subjects:
  - kind: ServiceAccount
    name: portal-pvc-backup
    namespace: personal-server
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: portal-pvc-backup-status
  namespace: monitoring
rules:
  - apiGroups: [""]
    resources: [configmaps]
    resourceNames: [sre-telegram-backup-status]
    verbs: [get, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: portal-pvc-backup-status
  namespace: monitoring
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: portal-pvc-backup-status
subjects:
  - kind: ServiceAccount
    name: portal-pvc-backup
    namespace: personal-server
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: portal-pvc-backup
  namespace: personal-server
spec:
  schedule: "0 3 * * *"
  timeZone: Asia/Seoul
  suspend: true
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 14400
      ttlSecondsAfterFinished: 86400
      template:
        spec:
          serviceAccountName: portal-pvc-backup
          restartPolicy: Never
          terminationGracePeriodSeconds: 300
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            fsGroup: 10001
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: backup
              image: personal-server-portal-pvc-backup:task2
              imagePullPolicy: Never
              command: [/opt/personal-server/portal-pvc-backup-verify.sh, --go]
              env:
                - name: PORTAL_BACKUP_EXECUTION_MODE
                  value: in-cluster
                - name: TMPDIR
                  value: /work
                - name: PORTAL_RCLONE_CONFIG_FILE
                  value: /run/secrets/portal-backup/rclone-config
                - name: PORTAL_RCLONE_PASSWORD_COMMAND
                  value: /usr/bin/cat /run/secrets/portal-backup/rclone-config-passphrase
              securityContext:
                runAsNonRoot: true
                runAsUser: 10001
                runAsGroup: 10001
                readOnlyRootFilesystem: true
                allowPrivilegeEscalation: false
                capabilities:
                  drop: [ALL]
              resources:
                requests:
                  cpu: 100m
                  memory: 256Mi
                  ephemeral-storage: 1Gi
                limits:
                  cpu: "1"
                  memory: 1Gi
                  ephemeral-storage: 11Gi
              volumeMounts:
                - name: portal-files
                  mountPath: /data/files
                  readOnly: true
                - name: portal-state
                  mountPath: /data/portal-web-state
                  readOnly: true
                - name: backup-runtime
                  mountPath: /run/secrets/portal-backup
                  readOnly: true
                - name: work
                  mountPath: /work
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: portal-files
              persistentVolumeClaim:
                claimName: portal-web-files-dynamic
                readOnly: true
            - name: portal-state
              persistentVolumeClaim:
                claimName: portal-web-state-dynamic
                readOnly: true
            - name: backup-runtime
              secret:
                secretName: portal-pvc-backup-runtime
                optional: false
                items:
                  - key: rclone-config
                    path: rclone-config
                  - key: rclone-config-passphrase
                    path: rclone-config-passphrase
                  - key: age-recipient
                    path: age-recipient
                  - key: age-identity
                    path: age-identity
                defaultMode: 0440
            - name: work
              emptyDir:
                sizeLimit: 10Gi
            - name: tmp
              emptyDir:
                sizeLimit: 1Gi
