apiVersion: v1
kind: Namespace
metadata:
  name: observability-lab
  labels:
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-lab
  namespace: observability-lab
data:
  loki.yaml: |
    auth_enabled: false
    server:
      http_listen_port: 3100
    common:
      path_prefix: /loki
      replication_factor: 1
      ring:
        kvstore:
          store: inmemory
      storage:
        filesystem:
          chunks_directory: /loki/chunks
          rules_directory: /loki/rules
    schema_config:
      configs:
        - from: "2024-01-01"
          store: tsdb
          object_store: filesystem
          schema: v13
          index:
            prefix: index_
            period: 24h
    limits_config:
      retention_period: 24h
    compactor:
      working_directory: /loki/compactor
      retention_enabled: true
      delete_request_store: filesystem
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: loki-lab-data
  namespace: observability-lab
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loki-lab
  namespace: observability-lab
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: loki-lab
  template:
    metadata:
      labels:
        app.kubernetes.io/name: loki-lab
    spec:
      serviceAccountName: default
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: loki
          image: grafana/loki:3.7.0
          imagePullPolicy: IfNotPresent
          args: ["-config.file=/etc/loki/loki.yaml", "-target=all"]
          ports:
            - name: http
              containerPort: 3100
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: config
              mountPath: /etc/loki
              readOnly: true
            - name: data
              mountPath: /loki
      volumes:
        - name: config
          configMap:
            name: loki-lab
        - name: data
          persistentVolumeClaim:
            claimName: loki-lab-data
---
apiVersion: v1
kind: Service
metadata:
  name: loki-lab
  namespace: observability-lab
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: loki-lab
  ports:
    - name: http
      port: 3100
      targetPort: http
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-lab-alloy
  namespace: observability-lab
data:
  config.alloy: |
    discovery.kubernetes "sample" {
      role = "pod"
      selectors {
        role = "pod"
        label = "app.kubernetes.io/name=loki-lab-sample"
      }
      namespaces {
        names = ["observability-lab"]
      }
    }

    discovery.relabel "sample" {
      targets = discovery.kubernetes.sample.targets
      rule {
        source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
        target_label = "app"
      }
      rule {
        source_labels = ["__meta_kubernetes_namespace"]
        target_label = "namespace"
      }
    }

    loki.source.kubernetes "sample" {
      targets = discovery.relabel.sample.output
      forward_to = [loki.write.lab.receiver]
    }

    loki.write "lab" {
      endpoint {
        url = "http://loki-lab.observability-lab.svc.cluster.local:3100/loki/api/v1/push"
      }
    }
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: loki-lab-alloy
  namespace: observability-lab
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: loki-lab-alloy
  namespace: observability-lab
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: loki-lab-alloy
  namespace: observability-lab
subjects:
  - kind: ServiceAccount
    name: loki-lab-alloy
    namespace: observability-lab
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: loki-lab-alloy
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loki-lab-alloy
  namespace: observability-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: loki-lab-alloy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: loki-lab-alloy
    spec:
      serviceAccountName: loki-lab-alloy
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: alloy
          image: grafana/alloy:v1.10.2
          imagePullPolicy: IfNotPresent
          args: ["run", "/etc/alloy/config.alloy", "--storage.path=/tmp/alloy"]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: config
              mountPath: /etc/alloy
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: loki-lab-alloy
        - name: tmp
          emptyDir:
            sizeLimit: 128Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loki-lab-sample
  namespace: observability-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: loki-lab-sample
  template:
    metadata:
      labels:
        app.kubernetes.io/name: loki-lab-sample
    spec:
      serviceAccountName: default
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: sample
          image: busybox:1.36.1
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c", "while true; do echo 'loki lab sample ready'; sleep 30; done"]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
