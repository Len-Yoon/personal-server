apiVersion: v1
kind: Namespace
metadata:
  name: deployment-rollback-lab
  labels:
    app.kubernetes.io/managed-by: deployment-rollback-lab
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rollback-sample
  namespace: deployment-rollback-lab
  labels:
    app.kubernetes.io/managed-by: deployment-rollback-lab
spec:
  replicas: 1
  strategy:
    type: Recreate
  progressDeadlineSeconds: 60
  selector:
    matchLabels:
      app.kubernetes.io/name: rollback-sample
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rollback-sample
        app.kubernetes.io/managed-by: deployment-rollback-lab
    spec:
      automountServiceAccountToken: false
      hostNetwork: false
      hostPID: false
      hostIPC: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: sample
          image: busybox@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662
          command: ["/bin/sh", "-c", "mkdir -p /tmp/www; printf 'rollback lab sample ready' > /tmp/www/index.html; exec httpd -f -p 127.0.0.1:8080 -h /tmp/www"]
          readinessProbe:
            exec:
              command: ["/bin/sh", "-c", "test \"$(wget -qO- -T 1 http://127.0.0.1:8080/)\" = 'rollback lab sample ready'"]
            periodSeconds: 2
            timeoutSeconds: 1
            failureThreshold: 1
          resources:
            requests:
              cpu: 5m
              memory: 8Mi
            limits:
              cpu: 50m
              memory: 32Mi
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
