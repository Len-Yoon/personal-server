<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1740" viewBox="0 0 1200 1740" role="img" aria-labelledby="title desc">
  <title id="title">Personal Server 운영 구조</title>
  <desc id="desc">공개 서비스 경로, Windows N100과 WSL2 실행 환경, K3s와 Docker Compose 서비스, 자동복구, 관측과 알림, 외부 상태 점검, 데이터 보호를 구분한 개인 서버 운영 구조도</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker>
    <style>
      .title { font: 700 42px Arial, 'Apple SD Gothic Neo', sans-serif; fill: #0f172a; }
      .subtitle { font: 400 20px Arial, 'Apple SD Gothic Neo', sans-serif; fill: #475569; }
      .section { font: 700 24px Arial, 'Apple SD Gothic Neo', sans-serif; fill: #334155; }
      .label { font: 700 25px Arial, 'Apple SD Gothic Neo', sans-serif; fill: #0f172a; }
      .body { font: 400 19px Arial, 'Apple SD Gothic Neo', sans-serif; fill: #334155; }
      .note { font: 400 16px Arial, 'Apple SD Gothic Neo', sans-serif; fill: #475569; }
      .route { stroke: #64748b; stroke-width: 4; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1200" height="1740" fill="#f8fafc"/>
  <text x="70" y="78" class="title">Personal Server 운영 구조</text>
  <text x="70" y="116" class="subtitle">서비스 제공 · 컨테이너 실행 보안 · 자동복구 · 관측 · 데이터 보호를 함께 운영</text>

  <!-- Public route -->
  <rect x="55" y="155" width="1090" height="250" rx="26" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="95" y="200" class="section">① 공개 서비스 경로</text>
  <rect x="105" y="240" width="250" height="105" rx="18" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
  <text x="230" y="282" text-anchor="middle" class="label">Internet</text>
  <text x="230" y="314" text-anchor="middle" class="body">공개 사용자</text>
  <rect x="475" y="240" width="250" height="105" rx="18" fill="#fff7ed" stroke="#f97316" stroke-width="3"/>
  <text x="600" y="282" text-anchor="middle" class="label">Cloudflare Tunnel</text>
  <text x="600" y="314" text-anchor="middle" class="body">안전한 공개 연결</text>
  <rect x="845" y="240" width="250" height="105" rx="18" fill="#fef3c7" stroke="#d97706" stroke-width="3"/>
  <text x="970" y="282" text-anchor="middle" class="label">Caddy</text>
  <text x="970" y="314" text-anchor="middle" class="body">도메인별 라우팅</text>
  <path d="M355 292 H475" class="route"/>
  <path d="M725 292 H845" class="route"/>
  <text x="600" y="380" text-anchor="middle" class="note">Caddy가 Portal과 Docker Compose 서비스로 요청을 분기함</text>

  <!-- Runtime -->
  <rect x="55" y="440" width="1090" height="450" rx="26" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/>
  <text x="95" y="487" class="section">② Windows N100 · WSL2 실행 환경</text>
  <text x="95" y="516" class="note">Cloudflare Tunnel과 Caddy는 WSL 사용자 환경에서 실행</text>

  <rect x="95" y="555" width="475" height="285" rx="20" fill="#ffffff" stroke="#60a5fa" stroke-width="2.5"/>
  <text x="130" y="600" class="section">K3s</text>
  <rect x="130" y="635" width="185" height="155" rx="16" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
  <text x="222" y="679" text-anchor="middle" class="label">portal-web</text>
  <text x="222" y="710" text-anchor="middle" class="body">Portal</text>
  <text x="222" y="739" text-anchor="middle" class="body">File Manager</text>
  <rect x="350" y="635" width="185" height="155" rx="16" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
  <text x="442" y="679" text-anchor="middle" class="label">Portal PVC</text>
  <text x="442" y="710" text-anchor="middle" class="body">파일·상태 데이터</text>
  <text x="442" y="739" text-anchor="middle" class="body">단일 writer</text>
  <path d="M315 711 H350" class="route"/>

  <rect x="630" y="555" width="475" height="285" rx="20" fill="#ffffff" stroke="#22c55e" stroke-width="2.5"/>
  <text x="665" y="600" class="section">Docker Compose</text>
  <rect x="665" y="635" width="190" height="155" rx="16" fill="#f0fdf4" stroke="#86efac" stroke-width="2"/>
  <text x="760" y="679" text-anchor="middle" class="label">정보·기록</text>
  <text x="760" y="710" text-anchor="middle" class="body">News Hub</text>
  <text x="760" y="739" text-anchor="middle" class="body">YouTube · Book</text>
  <rect x="885" y="635" width="185" height="155" rx="16" fill="#f0fdf4" stroke="#86efac" stroke-width="2"/>
  <text x="977" y="679" text-anchor="middle" class="label">자동화·운영</text>
  <text x="977" y="710" text-anchor="middle" class="body">차량관리</text>
  <text x="977" y="739" text-anchor="middle" class="body">HomeOps</text>
  <text x="867" y="820" text-anchor="middle" class="note">car.len.pe.kr OAuth callback은 Caddy를 거치지 않는 예외 경로</text>
  <text x="600" y="865" text-anchor="middle" class="note">Caddy · Portal · 차량관리 · HomeOps · System agent는 UID/GID 10001로 실행</text>

  <!-- Operations cards -->
  <text x="70" y="950" class="section">③ 운영·보호 체계</text>

  <rect x="55" y="985" width="525" height="255" rx="24" fill="#eef2ff" stroke="#4f46e5" stroke-width="3"/>
  <text x="95" y="1030" class="section">N100 제한형 자동복구</text>
  <text x="95" y="1080" class="label">KeepAlive → Supervisor → Daemon</text>
  <text x="95" y="1115" class="body">WSL 유지 · 단일 실행 · 3분 상태 점검</text>
  <text x="95" y="1148" class="body">K3s · Portal · Tunnel만 제한 복구</text>
  <text x="95" y="1192" class="note">대상별 최대 3회 · 무한 재시작 방지</text>

  <rect x="620" y="985" width="525" height="255" rx="24" fill="#ecfdf5" stroke="#059669" stroke-width="3"/>
  <text x="660" y="1030" class="section">내부 관측·알림</text>
  <text x="660" y="1080" class="label">Prometheus → Grafana</text>
  <text x="660" y="1115" class="body">상태와 지표 조회</text>
  <text x="660" y="1155" class="label">Alertmanager → SRE relay → Telegram</text>
  <text x="660" y="1192" class="note">내부 이상과 복구 상태 알림</text>

  <rect x="55" y="1280" width="525" height="255" rx="24" fill="#fdf4ff" stroke="#a855f7" stroke-width="3"/>
  <text x="95" y="1325" class="section">독립 외부 상태 점검</text>
  <text x="95" y="1375" class="label">GitHub Actions · Codex</text>
  <text x="95" y="1410" class="body">공개 /health · 일일 상태 점검</text>
  <text x="95" y="1448" class="label">장애·복구 → Telegram</text>
  <text x="95" y="1488" class="note">CI·Trivy·외부 health를 독립 확인</text>

  <rect x="620" y="1280" width="525" height="255" rx="24" fill="#fff7ed" stroke="#ea580c" stroke-width="3"/>
  <text x="660" y="1325" class="section">Portal 데이터 보호</text>
  <text x="660" y="1375" class="label">Portal PVC → 암호화 백업</text>
  <text x="660" y="1410" class="body">원격 보관</text>
  <text x="660" y="1448" class="label">복원 검증</text>
  <text x="660" y="1488" class="note">백업 파일뿐 아니라 실제 복원 가능 여부를 확인</text>

  <text x="600" y="1645" text-anchor="middle" class="note">실선은 공개 서비스 요청 흐름을 나타냄</text>
  <text x="600" y="1680" text-anchor="middle" class="note">운영·보호 카드는 서로 독립된 감시·복구·보호 경계를 나타냄</text>
</svg>
