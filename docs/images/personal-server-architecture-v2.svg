<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1510" viewBox="0 0 1200 1510" role="img" aria-labelledby="title desc">
  <title id="title">Personal Server 현재 운영 구조</title>
  <desc id="desc">공개 서비스 경로, N100 WSL2 안의 K3s와 Docker Compose, 컨테이너 실행 보안 경계, 운영과 데이터 보호 흐름을 표시한 구조도</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L0,10 L10,5 z" fill="#64748b"/></marker>
    <style>
      .title{font:700 42px Arial,'Apple SD Gothic Neo',sans-serif;fill:#10213d}.subtitle{font:400 18px Arial,'Apple SD Gothic Neo',sans-serif;fill:#52627a}.section{font:700 23px Arial,'Apple SD Gothic Neo',sans-serif;fill:#1f3557}.card-title{font:700 22px Arial,'Apple SD Gothic Neo',sans-serif;fill:#13233c}.card-body{font:400 17px Arial,'Apple SD Gothic Neo',sans-serif;fill:#38506f}.note{font:400 15px Arial,'Apple SD Gothic Neo',sans-serif;fill:#52627a}.route{stroke:#64748b;stroke-width:3;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>

  <rect width="1200" height="1510" fill="#f8fafc"/>
  <text x="70" y="76" class="title">Personal Server 현재 운영 구조</text>
  <text x="70" y="110" class="subtitle">공개 서비스 · 격리 실행 · 제한형 복구 · 관측 · 데이터 보호</text>

  <!-- Public route -->
  <rect x="55" y="145" width="1090" height="230" rx="24" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="85" y="190" class="section">01 · 공개 서비스 경로</text>
  <rect x="95" y="225" width="250" height="105" rx="16" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
  <text x="220" y="267" text-anchor="middle" class="card-title">Internet</text>
  <text x="220" y="298" text-anchor="middle" class="card-body">공개 사용자</text>
  <rect x="475" y="225" width="250" height="105" rx="16" fill="#fff7ed" stroke="#f97316" stroke-width="2.5"/>
  <text x="600" y="267" text-anchor="middle" class="card-title">Cloudflare Tunnel</text>
  <text x="600" y="298" text-anchor="middle" class="card-body">안전한 공개 연결</text>
  <rect x="855" y="225" width="250" height="105" rx="16" fill="#fef3c7" stroke="#d97706" stroke-width="2.5"/>
  <text x="980" y="267" text-anchor="middle" class="card-title">Caddy</text>
  <text x="980" y="298" text-anchor="middle" class="card-body">도메인별 라우팅</text>
  <path d="M345 277 H475" class="route"/><path d="M725 277 H855" class="route"/>
  <text x="600" y="355" text-anchor="middle" class="note">Caddy가 Portal과 Compose 서비스를 각각의 경로로 연결함</text>

  <!-- Runtime -->
  <rect x="55" y="415" width="1090" height="490" rx="26" fill="#eff6ff" stroke="#2563eb" stroke-width="2.5"/>
  <text x="85" y="462" class="section">02 · Windows N100 · WSL2 실행 환경</text>
  <text x="85" y="491" class="note">공개 경로와 서비스 실행 환경을 분리하여 운영함</text>

  <rect x="90" y="530" width="485" height="250" rx="20" fill="#ffffff" stroke="#60a5fa" stroke-width="2.5"/>
  <text x="120" y="574" class="section">K3s · personal-server</text>
  <rect x="120" y="610" width="190" height="125" rx="15" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="215" y="652" text-anchor="middle" class="card-title">portal-web</text>
  <text x="215" y="682" text-anchor="middle" class="card-body">Portal · 파일함</text>
  <text x="215" y="710" text-anchor="middle" class="note">UID/GID 10001</text>
  <rect x="345" y="610" width="195" height="125" rx="15" fill="#e0f2fe" stroke="#38bdf8" stroke-width="2"/>
  <text x="442" y="652" text-anchor="middle" class="card-title">Portal PVC</text>
  <text x="442" y="682" text-anchor="middle" class="card-body">파일 · 상태 데이터</text>
  <text x="442" y="710" text-anchor="middle" class="note">K3s 단일 writer</text>
  <path d="M310 672 H345" class="route"/>

  <rect x="625" y="530" width="485" height="250" rx="20" fill="#ffffff" stroke="#22c55e" stroke-width="2.5"/>
  <text x="655" y="574" class="section">Docker Compose</text>
  <rect x="655" y="610" width="190" height="125" rx="15" fill="#dcfce7" stroke="#4ade80" stroke-width="2"/>
  <text x="750" y="652" text-anchor="middle" class="card-title">정보 · 기록</text>
  <text x="750" y="682" text-anchor="middle" class="card-body">News · YouTube · Book</text>
  <text x="750" y="710" text-anchor="middle" class="note">서비스별 데이터 경로</text>
  <rect x="880" y="610" width="195" height="125" rx="15" fill="#dcfce7" stroke="#4ade80" stroke-width="2"/>
  <text x="977" y="652" text-anchor="middle" class="card-title">자동화 · 운영</text>
  <text x="977" y="682" text-anchor="middle" class="card-body">차량관리 · HomeOps</text>
  <text x="977" y="710" text-anchor="middle" class="note">제한된 운영 작업</text>

  <rect x="90" y="815" width="1020" height="55" rx="14" fill="#172554"/>
  <text x="120" y="850" style="font:700 17px Arial,'Apple SD Gothic Neo',sans-serif;fill:#dbeafe">실행 보안 경계</text>
  <text x="305" y="850" style="font:400 16px Arial,'Apple SD Gothic Neo',sans-serif;fill:#ffffff">핵심 컨테이너 UID/GID 10001 · Caddy는 필요한 포트 권한만 사용</text>
  <text x="600" y="892" text-anchor="middle" class="note">car.len.pe.kr OAuth callback은 Caddy를 거치지 않는 예외 경로</text>

  <!-- Operations -->
  <text x="70" y="965" class="section">03 · 운영 · 관측 · 데이터 보호</text>
  <rect x="55" y="995" width="525" height="195" rx="20" fill="#eef2ff" stroke="#6366f1" stroke-width="2.5"/>
  <text x="85" y="1040" class="section">제한형 자동복구</text>
  <text x="85" y="1082" class="card-title">KeepAlive → Supervisor → Daemon</text>
  <text x="85" y="1115" class="card-body">WSL 유지 · 단일 실행 · 상태 점검</text>
  <text x="85" y="1150" class="note">K3s · Portal · Tunnel만 대상별 최대 3회 복구</text>

  <rect x="620" y="995" width="525" height="195" rx="20" fill="#ecfdf5" stroke="#059669" stroke-width="2.5"/>
  <text x="650" y="1040" class="section">내부 관측 · 알림</text>
  <text x="650" y="1082" class="card-title">Prometheus → Grafana</text>
  <text x="650" y="1115" class="card-body">Alertmanager → SRE relay → Telegram</text>
  <text x="650" y="1150" class="note">노드 · Pod · PVC · 서비스 상태 관측</text>

  <rect x="55" y="1230" width="525" height="195" rx="20" fill="#faf5ff" stroke="#a855f7" stroke-width="2.5"/>
  <text x="85" y="1275" class="section">외부 상태 점검</text>
  <text x="85" y="1317" class="card-title">GitHub Actions · 일일 점검</text>
  <text x="85" y="1350" class="card-body">공개 health · CI · Trivy 확인</text>
  <text x="85" y="1385" class="note">조치가 필요할 때만 운영 알림을 전달함</text>

  <rect x="620" y="1230" width="525" height="195" rx="20" fill="#fff7ed" stroke="#ea580c" stroke-width="2.5"/>
  <text x="650" y="1275" class="section">Portal 데이터 보호</text>
  <text x="650" y="1317" class="card-title">Portal PVC → 암호화 백업</text>
  <text x="650" y="1350" class="card-body">원격 보관 · 복원 검증</text>
  <text x="650" y="1385" class="note">백업과 복원 결과를 운영 알림 경로로 보고함</text>
</svg>
