<text x="56" y="706" class="body">앞 단계 성공 후 다음 단계 · 잠금 → 암호화 Drive 업로드 → 재다운로드·격리 복원 → 보존 정리</text>
<text x="56" y="739" class="small">차량 DB: 동일 내용 건너뜀 / 주기적 실제 검증 · 일 7 / 주 4 / 월 3 + 최신 7개 안전 하한</text>
<rect x="36" y="782" width="1368" height="182" rx="12" fill="#15243b" stroke="#345371"/>
<text x="56" y="815" class="heading">관측과 백업 상태 전달</text>
<text x="56" y="851" class="body">Prometheus → Grafana</text>
<text x="56" y="880" class="small">NewsCollectionStale → Alertmanager → SRE relay → Telegram</text>
<text x="56" y="910" class="small">월간 SRE 통합 점검 · Loki / Alloy / Ansible은 실습 범위</text>
<text x="760" y="851" class="body">차량 5분 감시 → 고정 ConfigMap → Relay → Portal</text>
<text x="760" y="880" class="body">GitHub Actions · 약 5분 공개 health</text>
<text x="760" y="910" class="small">CI/Trivy 통과 ≠ 운영 배포 · K3s 이미지 교체는 승인 범위</text>
<text x="56" y="943" class="small">NodePort 이상은 Tunnel 복구 제외 · 단일 호스트 장애를 견디는 HA 구성 아님</text>
