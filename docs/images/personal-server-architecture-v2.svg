<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1660" viewBox="0 0 1440 1660" role="img" aria-labelledby="title desc">
  <title id="title">Personal Server 현재 운영 구조</title>
  <desc id="desc">Cloudflare Tunnel에서 WSL loopback Caddy를 거쳐 K3s Portal, News, YouTube Memo, Book Memo Service와 서비스별 PVC로 전달되는 현재 공개 경로 및 운영 보조 구성도</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L0 10 L10 5 z" fill="#64748b"/></marker>
    <style>
      .title{font:700 42px 'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',Arial,sans-serif;fill:#10213d}
      .subtitle{font:400 19px 'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',Arial,sans-serif;fill:#52627a}
      .section{font:700 24px 'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',Arial,sans-serif;fill:#1f3557}
      .card-title{font:700 20px 'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',Arial,sans-serif;fill:#13233c}
      .card-body{font:400 16px 'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',Arial,sans-serif;fill:#38506f}
      .note{font:400 15px 'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',Arial,sans-serif;fill:#52627a}
      .small{font:400 14px 'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',Arial,sans-serif;fill:#52627a}
      .route{stroke:#64748b;stroke-width:3;fill:none;marker-end:url(#arrow)}
      .k3s-route{stroke:#059669;stroke-width:3;fill:none;marker-end:url(#arrow)}
      .private{stroke:#a855f7;stroke-width:3;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>

  <rect width="1440" height="1660" fill="#f8fafc"/>
  <text x="70" y="76" class="title">Personal Server 현재 운영 구조</text>
  <text x="70" y="112" class="subtitle">공개 경로 · K3s 단일 writer · 서비스별 데이터 · 운영 보조 구성</text>

  <rect x="55" y="150" width="1330" height="635" rx="24" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="85" y="198" class="section">01 · 공개 서비스 경로</text>

  <rect x="95" y="245" width="220" height="105" rx="16" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
  <text x="205" y="287" text-anchor="middle" class="card-title">Internet</text>
  <text x="205" y="317" text-anchor="middle" class="card-body">공개 사용자</text>

  <rect x="390" y="245" width="250" height="105" rx="16" fill="#fff7ed" stroke="#f97316" stroke-width="2.5"/>
  <text x="515" y="287" text-anchor="middle" class="card-title">Cloudflare Tunnel</text>
  <text x="515" y="317" text-anchor="middle" class="card-body">호스트별 ingress 분기</text>
  <path d="M315 298 H390" class="route"/>

  <rect x="715" y="245" width="265" height="105" rx="16" fill="#fef3c7" stroke="#d97706" stroke-width="2.5"/>
  <text x="847" y="287" text-anchor="middle" class="card-title">WSL loopback Caddy</text>
  <text x="847" y="317" text-anchor="middle" class="card-body">TLS 종료 · K3s upstream 연결</text>
  <path d="M640 298 H715" class="route"/>

  <rect x="1055" y="245" width="285" height="105" rx="16" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/>
  <text x="1197" y="287" text-anchor="middle" class="card-title">K3s Service</text>
  <text x="1197" y="317" text-anchor="middle" class="card-body">준비된 Pod로만 요청 전달</text>
  <path d="M980 298 H1055" class="k3s-route"/>

  <text x="600" y="395" class="note">Cloudflare Tunnel → Caddy → K3s Service</text>
  <text x="600" y="423" class="card-body">Portal · News · YouTube · Books</text>

  <rect x="95" y="465" width="1245" height="120" rx="18" fill="#f0fdf4" stroke="#86efac" stroke-width="2"/>
  <text x="125" y="505" class="card-title">K3s 공개 앱 · 단일 writer</text>
  <text x="125" y="538" class="card-body">portal-web Service</text>
  <text x="405" y="538" class="card-body">crawler-worker Service</text>
  <text x="725" y="538" class="card-body">youtube-memo Service</text>
  <text x="1050" y="538" class="card-body">book-memo Service</text>
  <path d="M1197 350 V465" class="k3s-route"/>

  <rect x="95" y="620" width="1245" height="115" rx="18" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
  <text x="125" y="660" class="card-title">서비스별 PVC · 단일 writer</text>
  <text x="125" y="696" class="card-body">Portal PVC · Crawler PVC · YouTube PVC · Book PVC</text>
  <text x="125" y="720" class="note">Pod가 교체되어도 서비스 데이터는 각 PVC에 유지됨</text>
  <path d="M718 585 V620" class="k3s-route"/>

  <rect x="95" y="375" width="405" height="65" rx="15" fill="#faf5ff" stroke="#a855f7" stroke-width="2.5"/>
  <text x="297" y="403" text-anchor="middle" class="card-title">차량 OAuth callback</text>
  <text x="297" y="426" text-anchor="middle" class="small">별도 ingress · 비공개 callback upstream</text>
  <path d="M515 350 V407 H500" class="private"/>

  <rect x="55" y="830" width="1330" height="360" rx="24" fill="#eff6ff" stroke="#2563eb" stroke-width="2.5"/>
  <text x="85" y="878" class="section">02 · Windows N100 · WSL2 실행 환경</text>
  <text x="85" y="908" class="note">공개 웹 앱은 K3s가 관리하고, 프록시·차량관리·운영 보조는 Compose로 분리함</text>

  <rect x="85" y="950" width="785" height="185" rx="20" fill="#ffffff" stroke="#60a5fa" stroke-width="2.5"/>
  <text x="115" y="995" class="section">K3s · 공개 앱 실행</text>
  <text x="115" y="1030" class="card-body">portal-web · crawler-worker · youtube-memo · book-memo</text>
  <text x="115" y="1060" class="note">Deployment · Service · readiness · 서비스별 PVC</text>
  <text x="115" y="1090" class="note">각 앱은 하나의 production writer만 유지함</text>

  <rect x="905" y="950" width="435" height="185" rx="20" fill="#ffffff" stroke="#4ade80" stroke-width="2.5"/>
  <text x="935" y="995" class="section">Docker Compose · 운영 보조</text>
  <text x="935" y="1030" class="card-body">Caddy · 차량관리 · HomeOps</text>
  <text x="935" y="1060" class="note">배포 스크립트가 조회한 upstream을 Caddy에 전달</text>
  <text x="935" y="1090" class="note">K3s 전환 서비스의 Docker writer는 중지 상태임</text>

  <text x="70" y="1255" class="section">03 · 운영 · 관측 · 데이터 보호</text>

  <rect x="55" y="1285" width="625" height="155" rx="20" fill="#eef2ff" stroke="#6366f1" stroke-width="2.5"/>
  <text x="85" y="1328" class="section">N100 제한형 자동복구</text>
  <text x="85" y="1364" class="card-body">KeepAlive → Supervisor → Daemon</text>
  <text x="85" y="1392" class="note">WSL · K3s · Portal · Tunnel 상태 점검 · 구성요소별 최대 3회</text>
  <text x="85" y="1418" class="note">NodePort 이상은 Tunnel 복구 제외</text>

  <rect x="715" y="1285" width="625" height="155" rx="20" fill="#ecfdf5" stroke="#059669" stroke-width="2.5"/>
  <text x="745" y="1328" class="section">내부 관측 · 알림</text>
  <text x="745" y="1364" class="card-body">Prometheus → Grafana</text>
  <text x="745" y="1392" class="note">NewsCollectionStale → Alertmanager → SRE relay → Telegram</text>
  <text x="745" y="1418" class="note">뉴스 수집 지연은 감지·알림만 수행하고 자동복구하지 않음</text>

  <rect x="55" y="1475" width="625" height="145" rx="20" fill="#faf5ff" stroke="#a855f7" stroke-width="2.5"/>
  <text x="85" y="1518" class="section">외부 상태 점검</text>
  <text x="85" y="1553" class="card-body">GitHub Actions · 약 5분 공개 health</text>
  <text x="85" y="1583" class="note">Portal · News · YouTube · Books의 장애·복구 전환 확인</text>

  <rect x="715" y="1475" width="625" height="145" rx="20" fill="#fff7ed" stroke="#ea580c" stroke-width="2.5"/>
  <text x="745" y="1518" class="section">백업 · 월간 운영 점검</text>
  <text x="745" y="1553" class="card-body">Portal PVC 암호화 백업 · 복원 검증</text>
  <text x="745" y="1583" class="note">월간 SRE 통합 점검 · 기존 Telegram relay</text>
</svg>
