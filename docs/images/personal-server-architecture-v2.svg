<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1000" viewBox="0 0 1440 1000" role="img" aria-labelledby="title desc"><title id="title">Personal Server 현재 운영 구조와 데이터 흐름</title><desc id="desc">Windows N100의 WSL2 안에서 K3s 웹 앱과 Compose 운영 도구를 분리하고 다섯 단계 순차 백업 및 관측 경로를 연결한 구성도</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#59c6da"/></marker></defs><style>text{font-family:Arial,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;fill:#e7edf7}.title{font-size:32px;font-weight:700}.heading{font-size:23px;font-weight:700}.body{font-size:20px}.small{font-size:17px;fill:#b9c8dd}.tag{fill:#69d8df;font-size:17px;font-weight:700}</style><rect width="1440" height="1000" rx="20" fill="#0c1424"/>
