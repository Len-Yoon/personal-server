rule_files:
- dashboard.rules.yaml
evaluation_interval: 1m
tests:
- interval: 1m
  input_series:
  - series: 'source_value{cluster="alpha"}'
    values: '2+0x10'
  - series: 'source_value{}'
    values: '3+0x10'
  - series: 'storage_operation_duration_seconds_count{job="kubelet",metrics_path="/metrics",instance="fixture",operation_name="mount",volume_plugin="local",status="success"}'
    values: '0+10x10'
  - series: 'storage_operation_duration_seconds_count{job="kubelet",metrics_path="/metrics",instance="fixture",operation_name="mount",volume_plugin="local",status="fail-unknown"}'
    values: '0+3x10'
  - series: 'storage_operation_duration_seconds_count{job="kubelet",metrics_path="/metrics",instance="fixture",operation_name="mount",volume_plugin="local"}'
    values: '0+9x10'
  promql_expr_test:
  - expr: display_cluster_test
    eval_time: 5m
    exp_samples:
    - labels: 'display_cluster_test{cluster="alpha",display_cluster="alpha"}'
      value: 2
    - labels: 'display_cluster_test{display_cluster="N100"}'
      value: 3
  - expr: storage_failure_test
    eval_time: 5m
    exp_samples:
    - labels: 'storage_failure_test{instance="fixture",operation_name="mount",volume_plugin="local"}'
      value: 0.05
- interval: 1m
  input_series:
  - series: 'storage_operation_duration_seconds_count{job="kubelet",metrics_path="/metrics",status="success"}'
    values: '0+10x10'
  promql_expr_test:
  - expr: storage_failure_test
    eval_time: 5m
    exp_samples: []
