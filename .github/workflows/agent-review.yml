name: Agent Review

on:
  pull_request:

permissions:
  contents: read

jobs:
  policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Collect pull request changes
        run: git diff --name-status -z --find-renames "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" > changed-files.nul
      - name: Review change policy
        id: scope
        shell: bash
        run: |
          set +e
          python3 scripts/verify_change_scope.py \
            --input changed-files.nul \
            --input-format git-name-status-z \
            --executed-checks \
            portal system-agent crawler-worker homeops-executor youtube-memo book-memo car-care-worker maintenance \
            > agent-review-scope.json
          status=$?
          echo "policy_status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: agent-review-scope
          path: agent-review-scope.json
      - name: Enforce review gate
        run: test "${{ steps.scope.outputs.policy_status }}" = "0"
