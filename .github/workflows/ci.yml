name: CI

permissions:
  contents: read

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  scope:
    runs-on: ubuntu-latest
    outputs:
      policy_status: ${{ steps.classify.outputs.policy_status }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Collect changed files
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git diff --name-status -z --find-renames "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" > changed-files.nul
          elif [[ "${{ github.event.before }}" =~ ^0+$ ]]; then
            git diff-tree --no-commit-id --name-status -z --find-renames --root -r "${{ github.sha }}" > changed-files.nul
          else
            git diff --name-status -z --find-renames "${{ github.event.before }}" "${{ github.sha }}" > changed-files.nul
          fi

      - name: Classify changed files
        id: classify
        shell: bash
        run: |
          set +e
          python3 scripts/verify_change_scope.py \
            --input changed-files.nul \
            --input-format git-name-status-z \
            > agent-loop-scope.json
          policy_status=$?
          echo "policy_status=$policy_status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload scope evidence
        uses: actions/upload-artifact@v4
        with:
          name: agent-loop-evidence
          path: |
            changed-files.nul
            agent-loop-scope.json

  test:
    needs: scope
    if: always()
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: portal
            requirements: portal-web/requirements.txt
            pythonpath: portal-web
            test_command: python3 -m unittest tests.test_file_access tests.test_portal_dashboard tests.test_portal_security tests.test_homeops tests.test_homeops_notifier
          - name: system-agent
            requirements: system-agent/requirements.txt
            pythonpath: system-agent
            test_command: python3 -m unittest tests.system_agent.test_metrics
          - name: crawler-worker
            requirements: crawler-worker/requirements.txt
            pythonpath: crawler-worker
            test_command: python3 -m unittest tests.crawler_worker.test_datetime_format tests.crawler_worker.test_investing_news_rss tests.crawler_worker.test_news_service tests.crawler_worker.test_news_routes tests.crawler_worker.test_rss_news
          - name: homeops-executor
            requirements: homeops-executor/requirements.txt
            pythonpath: homeops-executor
            test_command: python3 -m unittest tests.homeops_executor.test_docker_ops
          - name: youtube-memo
            requirements: youtube-memo/requirements.txt
            pythonpath: youtube-memo
            test_command: python3 -m unittest tests.youtube_memo.test_video_titles
          - name: book-memo
            requirements: book-memo/requirements.txt
            pythonpath: book-memo
            test_command: python3 -m unittest tests.book_memo.test_book_service
          - name: car-care-worker
            requirements: car-care-worker/requirements.txt
            pythonpath: car-care-worker
            test_command: python3 -m unittest discover -s tests/car_care_worker
          - name: maintenance
            requirements: ""
            pythonpath: .
            test_command: python3 -m unittest tests.test_compose_config tests.test_verify_change_scope tests.test_maintenance tests.test_windows_bootstrap tests.test_deploy_n100 tests.test_change_harness tests.test_change_harness_evals tests.test_token_measurements

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        if: matrix.requirements != ''
        run: python3 -m pip install -r ${{ matrix.requirements }}

      - name: Run unit tests
        env:
          PYTHONPATH: ${{ matrix.pythonpath }}
        run: ${{ matrix.test_command }}

  summary:
    needs: [scope, test]
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download scope evidence
        uses: actions/download-artifact@v4
        with:
          name: agent-loop-evidence
          path: .

      - name: Build agent-loop evidence
        id: evidence
        shell: bash
        run: |
          set +e
          check_results=()
          executed_checks=()
          if [[ "${{ needs.test.result }}" == "success" ]]; then
            executed_checks=(
              portal system-agent crawler-worker homeops-executor youtube-memo book-memo car-care-worker maintenance
            )
            check_results=(
              --check-result portal=success
              --check-result system-agent=success
              --check-result crawler-worker=success
              --check-result homeops-executor=success
              --check-result youtube-memo=success
              --check-result book-memo=success
              --check-result car-care-worker=success
              --check-result maintenance=success
            )
          fi
          python3 scripts/verify_change_scope.py \
            --input changed-files.nul \
            --input-format git-name-status-z \
            --test-result "${{ needs.test.result }}" \
            --executed-checks "${executed_checks[@]}" \
            > agent-loop-evidence.json
          policy_status=$?
          echo "policy_status=$policy_status" >> "$GITHUB_OUTPUT"

          python3 scripts/run_change_harness.py \
            --input changed-files.nul \
            --input-format git-name-status-z \
            "${check_results[@]}" \
            > agent-loop-harness.json
          harness_status=$?
          echo "harness_status=$harness_status" >> "$GITHUB_OUTPUT"

          python3 scripts/run_change_harness.py \
            --input changed-files.nul \
            --input-format git-name-status-z \
            "${check_results[@]}" \
            --agent-context \
            > agent-loop-harness-context.md
          context_status=$?
          echo "context_status=$context_status" >> "$GITHUB_OUTPUT"
          if [[ "$harness_status" -ne "$context_status" ]]; then
            exit 1
          fi
          exit 0

      - name: Write GitHub Step Summary
        shell: bash
        run: |
          missing_checks=$(python3 -c 'import json,sys; value=json.load(open(sys.argv[1], encoding="utf-8"))["missing_checks"]; print(", ".join(value) if value else "none")' agent-loop-evidence.json)
          {
            echo "## Agent Loop Evidence"
            echo
            echo "- Policy status: \`${{ steps.evidence.outputs.policy_status }}\`"
            echo "- Service test result: \`${{ needs.test.result }}\`"
            echo "- Missing checks: \`$missing_checks\`"
            echo "- Harness status: \`${{ steps.evidence.outputs.harness_status }}\`"
            echo
            echo '```json'
            cat agent-loop-evidence.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload final evidence
        uses: actions/upload-artifact@v4
        with:
          name: agent-loop-final-evidence
          path: |
            agent-loop-evidence.json
            agent-loop-harness.json
            agent-loop-harness-context.md

      - name: Enforce policy and service test results
        shell: bash
        run: |
          test "${{ steps.evidence.outputs.policy_status }}" -eq 0
          test "${{ steps.evidence.outputs.harness_status }}" -eq 0
          test "${{ steps.evidence.outputs.context_status }}" -eq 0
          test "${{ needs.test.result }}" = "success"
