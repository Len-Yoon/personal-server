name: CI

permissions:
  contents: read

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  scope:
    runs-on: ubuntu-latest
    outputs:
      policy_status: ${{ steps.classify.outputs.policy_status }}
      selection: ${{ steps.select.outputs.selection }}

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Collect changed files
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git diff --name-status -z --find-renames "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" > changed-files.nul
          elif [[ "${{ github.event.before }}" =~ ^0+$ ]]; then
            git diff-tree --no-commit-id --name-status -z --find-renames --root -r "${{ github.sha }}" > changed-files.nul
          else
            git diff --name-status -z --find-renames "${{ github.event.before }}" "${{ github.sha }}" > changed-files.nul
          fi

      - name: Classify changed files
        id: classify
        shell: bash
        run: |
          set +e
          python3 scripts/verify_change_scope.py \
            --input changed-files.nul \
            --input-format git-name-status-z \
            > agent-loop-scope.json
          policy_status=$?
          echo "policy_status=$policy_status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload scope evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: agent-loop-evidence
          path: |
            changed-files.nul
            agent-loop-scope.json

      - name: Select CI suites
        id: select
        run: |
          python3 tests/run_service_tests.py --github-matrix --scope-evidence agent-loop-scope.json --changes-input changed-files.nul > ci-selection.json
          echo "selection=$(cat ci-selection.json)" >> "$GITHUB_OUTPUT"

  matrix:
    needs: scope
    if: always()
    runs-on: ubuntu-latest
    outputs:
      include: ${{ steps.generate.outputs.include }}
      selected_checks: ${{ steps.generate.outputs.selected_checks }}
      mode: ${{ steps.generate.outputs.mode }}

    steps:
      - name: Generate CI test matrix
        id: generate
        env:
          CI_SELECTION: ${{ needs.scope.outputs.selection }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os

          selection = json.loads(os.environ["CI_SELECTION"])
          include = selection["include"]
          selected = selection["selected_checks"]
          if not include or [entry["name"] for entry in include] != selected:
              raise SystemExit("CI selection is empty or inconsistent")
          print("include=" + json.dumps({"include": include}, separators=(",", ":")))
          print("selected_checks=" + json.dumps(selected, separators=(",", ":")))
          print("mode=" + selection["mode"])
          PY

  test:
    needs: [scope, matrix]
    if: always()
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.include) }}

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python_version }}

      - name: Install dependencies
        if: matrix.requirements != ''
        run: python3 -m pip install -r ${{ matrix.requirements }}

      - name: Install extra dependencies
        if: join(matrix.extra_packages, '') != ''
        run: python3 -m pip install ${{ join(matrix.extra_packages, ' ') }}

      - name: Run unit tests
        env:
          PYTHONPATH: ${{ matrix.pythonpath }}
        run: ${{ matrix.test_command }}

  summary:
    needs: [scope, matrix, test]
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Download scope evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: agent-loop-evidence
          path: .

      - name: Build agent-loop evidence
        id: evidence
        shell: bash
        env:
          CI_SELECTED_CHECKS_JSON: ${{ needs.matrix.outputs.selected_checks }}
        run: |
          set +e
          check_results=()
          executed_checks=()
          if [[ "${{ needs.test.result }}" == "success" ]]; then
            python3 - "$CI_SELECTED_CHECKS_JSON" <<'PY' > selected-checks.txt
          import json
          import sys

          selected = json.loads(sys.argv[1])
          if not isinstance(selected, list) or not selected or len(selected) != len(set(selected)):
              raise SystemExit("CI selected checks are missing or duplicated")
          for check in selected:
              if not isinstance(check, str) or not check or "\n" in check:
                  raise SystemExit("CI selected check is invalid")
              print(check)
          PY
            selection_status=$?
            if [[ "$selection_status" -ne 0 ]]; then
              exit 1
            fi
            mapfile -t executed_checks < selected-checks.txt
            for check in "${executed_checks[@]}"; do
              check_results+=(--check-result "$check=success")
            done
          fi
          python3 scripts/verify_change_scope.py \
            --input changed-files.nul \
            --input-format git-name-status-z \
            --test-result "${{ needs.test.result }}" \
            --executed-checks "${executed_checks[@]}" \
            > agent-loop-evidence.json
          policy_status=$?
          echo "policy_status=$policy_status" >> "$GITHUB_OUTPUT"

          python3 scripts/run_change_harness.py \
            --input changed-files.nul \
            --input-format git-name-status-z \
            "${check_results[@]}" \
            > agent-loop-harness.json
          harness_status=$?
          echo "harness_status=$harness_status" >> "$GITHUB_OUTPUT"

          python3 scripts/run_change_harness.py \
            --input changed-files.nul \
            --input-format git-name-status-z \
            "${check_results[@]}" \
            --agent-context \
            > agent-loop-harness-context.md
          context_status=$?
          echo "context_status=$context_status" >> "$GITHUB_OUTPUT"
          if [[ "$harness_status" -ne "$context_status" ]]; then
            exit 1
          fi
          exit 0

      - name: Write GitHub Step Summary
        shell: bash
        run: |
          missing_checks=$(python3 -c 'import json,sys; value=json.load(open(sys.argv[1], encoding="utf-8"))["missing_checks"]; print(", ".join(value) if value else "none")' agent-loop-evidence.json)
          {
            echo "## Agent Loop Evidence"
            echo
            echo "- Policy status: \`${{ steps.evidence.outputs.policy_status }}\`"
            echo "- Service test result: \`${{ needs.test.result }}\`"
            echo "- Selected CI mode: \`${{ needs.matrix.outputs.mode }}\`"
            echo "- Selected suites: \`${{ needs.matrix.outputs.selected_checks }}\`"
            echo "- Missing checks: \`$missing_checks\`"
            echo "- Harness status: \`${{ steps.evidence.outputs.harness_status }}\`"
            echo
            echo '```json'
            cat agent-loop-evidence.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload final evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: agent-loop-final-evidence
          path: |
            agent-loop-evidence.json
            agent-loop-harness.json
            agent-loop-harness-context.md

      - name: Enforce policy and service test results
        shell: bash
        run: |
          test "${{ steps.evidence.outputs.policy_status }}" -eq 0
          test "${{ steps.evidence.outputs.harness_status }}" -eq 0
          test "${{ steps.evidence.outputs.context_status }}" -eq 0
          test "${{ needs.test.result }}" = "success"
