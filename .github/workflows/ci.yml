name: CI

permissions:
  contents: read

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  scope:
    runs-on: ubuntu-latest
    outputs:
      policy_status: ${{ steps.classify.outputs.policy_status }}

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Collect changed files
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git diff --name-status -z --find-renames "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" > changed-files.nul
          elif [[ "${{ github.event.before }}" =~ ^0+$ ]]; then
            git diff-tree --no-commit-id --name-status -z --find-renames --root -r "${{ github.sha }}" > changed-files.nul
          else
            git diff --name-status -z --find-renames "${{ github.event.before }}" "${{ github.sha }}" > changed-files.nul
          fi

      - name: Classify changed files
        id: classify
        shell: bash
        run: |
          set +e
          python3 scripts/verify_change_scope.py \
            --input changed-files.nul \
            --input-format git-name-status-z \
            > agent-loop-scope.json
          policy_status=$?
          echo "policy_status=$policy_status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload scope evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: agent-loop-evidence
          path: |
            changed-files.nul
            agent-loop-scope.json

  matrix:
    needs: scope
    if: always()
    runs-on: ubuntu-latest
    outputs:
      include: ${{ steps.generate.outputs.include }}

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Generate CI test matrix
        id: generate
        run: |
          include="$(python3 tests/run_service_tests.py --github-matrix)"
          echo "include=$include" >> "$GITHUB_OUTPUT"

  test:
    needs: [scope, matrix]
    if: always()
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.include) }}

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python_version }}

      - name: Install dependencies
        if: matrix.requirements != ''
        run: python3 -m pip install -r ${{ matrix.requirements }}

      - name: Install extra dependencies
        if: join(matrix.extra_packages, '') != ''
        run: python3 -m pip install ${{ join(matrix.extra_packages, ' ') }}

      - name: Run unit tests
        env:
          PYTHONPATH: ${{ matrix.pythonpath }}
        run: ${{ matrix.test_command }}

  summary:
    needs: [scope, matrix, test]
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Download scope evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: agent-loop-evidence
          path: .

      - name: Build agent-loop evidence
        id: evidence
        shell: bash
        run: |
          set +e
          check_results=()
          executed_checks=()
          if [[ "${{ needs.test.result }}" == "success" ]]; then
            executed_checks=(
              portal system-agent crawler-worker homeops-executor youtube-memo book-memo car-care-worker maintenance k8s-contracts
            )
            check_results=(
              --check-result portal=success
              --check-result system-agent=success
              --check-result crawler-worker=success
              --check-result homeops-executor=success
              --check-result youtube-memo=success
              --check-result book-memo=success
              --check-result car-care-worker=success
              --check-result maintenance=success
              --check-result k8s-contracts=success
            )
          fi
          python3 scripts/verify_change_scope.py \
            --input changed-files.nul \
            --input-format git-name-status-z \
            --test-result "${{ needs.test.result }}" \
            --executed-checks "${executed_checks[@]}" \
            > agent-loop-evidence.json
          policy_status=$?
          echo "policy_status=$policy_status" >> "$GITHUB_OUTPUT"

          python3 scripts/run_change_harness.py \
            --input changed-files.nul \
            --input-format git-name-status-z \
            "${check_results[@]}" \
            > agent-loop-harness.json
          harness_status=$?
          echo "harness_status=$harness_status" >> "$GITHUB_OUTPUT"

          python3 scripts/run_change_harness.py \
            --input changed-files.nul \
            --input-format git-name-status-z \
            "${check_results[@]}" \
            --agent-context \
            > agent-loop-harness-context.md
          context_status=$?
          echo "context_status=$context_status" >> "$GITHUB_OUTPUT"
          if [[ "$harness_status" -ne "$context_status" ]]; then
            exit 1
          fi
          exit 0

      - name: Write GitHub Step Summary
        shell: bash
        run: |
          missing_checks=$(python3 -c 'import json,sys; value=json.load(open(sys.argv[1], encoding="utf-8"))["missing_checks"]; print(", ".join(value) if value else "none")' agent-loop-evidence.json)
          {
            echo "## Agent Loop Evidence"
            echo
            echo "- Policy status: \`${{ steps.evidence.outputs.policy_status }}\`"
            echo "- Service test result: \`${{ needs.test.result }}\`"
            echo "- Missing checks: \`$missing_checks\`"
            echo "- Harness status: \`${{ steps.evidence.outputs.harness_status }}\`"
            echo
            echo '```json'
            cat agent-loop-evidence.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload final evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: agent-loop-final-evidence
          path: |
            agent-loop-evidence.json
            agent-loop-harness.json
            agent-loop-harness-context.md

      - name: Enforce policy and service test results
        shell: bash
        run: |
          test "${{ steps.evidence.outputs.policy_status }}" -eq 0
          test "${{ steps.evidence.outputs.harness_status }}" -eq 0
          test "${{ steps.evidence.outputs.context_status }}" -eq 0
          test "${{ needs.test.result }}" = "success"
