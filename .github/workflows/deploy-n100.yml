name: Deploy N100

permissions:
  contents: read

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

jobs:
  deploy:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: [self-hosted, Windows, X64]
    concurrency:
      group: deploy-n100-${{ github.ref }}
      cancel-in-progress: false

    steps:
      - name: Verify N100 deployment directory
        shell: cmd
        run: |
          @echo off
          set "PROJECT_ROOT=C:\personal-server"
          whoami
          if not exist "%PROJECT_ROOT%\.git" exit /b 1
          if not exist "%PROJECT_ROOT%\.env" exit /b 1
          if not exist "%PROJECT_ROOT%\data" exit /b 1
          if not exist "%PROJECT_ROOT%\docker-compose.yml" exit /b 1
          if not exist "%PROJECT_ROOT%\docker-compose.n100.yml" exit /b 1

      - name: Run deployment script
        shell: cmd
        run: |
          @echo off
          if not exist "%SystemRoot%\System32\wsl.exe" exit /b 1
          wsl.exe -d Ubuntu-24.04 -- bash -lc "cd /mnt/c/personal-server && bash ./scripts/deploy-n100.sh"
          if errorlevel 1 exit /b 1

      - name: Verify deployed service health
        shell: cmd
        run: |
          @echo off
          wsl.exe -d Ubuntu-24.04 -- bash -lc "cd /mnt/c/personal-server && docker compose -f docker-compose.yml -f docker-compose.n100.yml ps && for service in portal-web system-agent crawler-worker youtube-memo book-memo caddy homeops-executor; do docker compose -f docker-compose.yml -f docker-compose.n100.yml ps --status running --services | grep -Fx $service > /dev/null || exit 1; done && for url in http://127.0.0.1:8000/health http://127.0.0.1:18010/health http://127.0.0.1:8001/health http://127.0.0.1:8002/health http://127.0.0.1:8003/health; do curl --fail --silent --show-error --retry 6 --retry-delay 5 $url > /dev/null || exit 1; done && docker inspect --format '{{.State.Health.Status}}' homeops-executor | grep -Fx healthy > /dev/null"
          if errorlevel 1 exit /b 1
