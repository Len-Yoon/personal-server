name: Deploy N100

permissions:
  actions: read
  contents: read

on:
  push:
    branches: [main]

jobs:
  changes:
    name: Classify safe N100 deployment
    runs-on: ubuntu-latest
    outputs:
      action: ${{ steps.classify.outputs.deploy_action }}
      services: ${{ steps.classify.outputs.deploy_services }}
      reason: ${{ steps.classify.outputs.deploy_reason }}
    steps:
      - id: wait-ci
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            const baseSha = context.payload.before;
            if (!/^[0-9a-f]{40}$/.test(baseSha) || /^0+$/.test(baseSha)) {
              throw new Error('The push before SHA is unavailable; automatic deployment is refused.');
            }
            core.setOutput('base_sha', baseSha);
            for (let attempt = 1; attempt <= 60; attempt += 1) {
              const { data } = await github.rest.actions.listWorkflowRuns({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: 'ci.yml',
                branch: 'main',
                event: 'push',
                head_sha: context.sha,
                per_page: 100,
              });
              const run = data.workflow_runs.find((candidate) =>
                candidate.event === 'push' && candidate.head_sha === context.sha
              );
              if (run && run.status === 'completed') {
                if (run.conclusion !== 'success') {
                  throw new Error(`CI did not succeed for ${context.sha}; automatic deployment is refused.`);
                }
                core.setOutput('ci_sha', run.head_sha);
                return;
              }
              await new Promise((resolve) => setTimeout(resolve, 10000));
            }
            throw new Error(`Timed out waiting for CI for ${context.sha}; automatic deployment is refused.`);
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - id: classify
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/classify-n100-safe-deployment.py \
            --base "${{ steps.wait-ci.outputs.base_sha }}" \
            --head "${{ github.sha }}" \
            --github-output "$GITHUB_OUTPUT"
          action="$(awk -F= '$1 == "deploy_action" {print $2}' "$GITHUB_OUTPUT")"
          case "$action" in
            deploy|skip) ;;
            blocked)
              printf '%s\n' 'action=blocked; automatic N100 deployment is refused' >&2
              exit 1
              ;;
            *)
              printf '%s\n' 'action=invalid; automatic N100 deployment is refused' >&2
              exit 1
              ;;
          esac

  deploy:
    if: needs.changes.outputs.action == 'deploy'
    needs: changes
    runs-on: [self-hosted, Windows, X64]
    concurrency:
      group: deploy-n100-${{ github.ref }}
      cancel-in-progress: false

    steps:
      - name: Verify N100 deployment directory
        shell: cmd
        run: |
          @echo off
          set "PROJECT_ROOT=C:\personal-server"
          whoami
          if not exist "%PROJECT_ROOT%\.git" exit /b 1
          if not exist "%PROJECT_ROOT%\.env" exit /b 1
          if not exist "%PROJECT_ROOT%\data" exit /b 1
          if not exist "%PROJECT_ROOT%\docker-compose.yml" exit /b 1
          if not exist "%PROJECT_ROOT%\docker-compose.n100.yml" exit /b 1

      - name: Run safe deployment
        shell: cmd
        env:
          N100_SAFE_DEPLOY_SHA: ${{ github.sha }}
          N100_SAFE_DEPLOY_SERVICES: ${{ needs.changes.outputs.services }}
        run: |
          @echo off
          if not exist "%SystemRoot%\System32\wsl.exe" exit /b 1
          set "WSLENV=N100_SAFE_DEPLOY_SHA:N100_SAFE_DEPLOY_SERVICES"
          wsl.exe -d Ubuntu-24.04 -- bash -lc "cd /mnt/c/personal-server && bash ./scripts/deploy-n100-safe.sh \"$N100_SAFE_DEPLOY_SHA\" \"$N100_SAFE_DEPLOY_SERVICES\""
          if errorlevel 1 exit /b 1
