name: Deploy N100

permissions:
  contents: read

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

jobs:
  changes:
    name: Classify safe N100 deployment
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    outputs:
      action: ${{ steps.classify.outputs.deploy_action }}
      services: ${{ steps.classify.outputs.deploy_services }}
      reason: ${{ steps.classify.outputs.deploy_reason }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 2
      - id: classify
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/classify-n100-safe-deployment.py \
            --base HEAD^ \
            --head HEAD \
            --github-output "$GITHUB_OUTPUT"
          action="$(awk -F= '$1 == "deploy_action" {print $2}' "$GITHUB_OUTPUT")"
          case "$action" in
            deploy|skip) ;;
            blocked)
              printf '%s\n' 'action=blocked; automatic N100 deployment is refused' >&2
              exit 1
              ;;
            *)
              printf '%s\n' 'action=invalid; automatic N100 deployment is refused' >&2
              exit 1
              ;;
          esac

  deploy:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      needs.changes.outputs.action == 'deploy'
    needs: changes
    runs-on: [self-hosted, Windows, X64]
    concurrency:
      group: deploy-n100-${{ github.ref }}
      cancel-in-progress: false

    steps:
      - name: Verify N100 deployment directory
        shell: cmd
        run: |
          @echo off
          set "PROJECT_ROOT=C:\personal-server"
          whoami
          if not exist "%PROJECT_ROOT%\.git" exit /b 1
          if not exist "%PROJECT_ROOT%\.env" exit /b 1
          if not exist "%PROJECT_ROOT%\data" exit /b 1
          if not exist "%PROJECT_ROOT%\docker-compose.yml" exit /b 1
          if not exist "%PROJECT_ROOT%\docker-compose.n100.yml" exit /b 1

      - name: Run safe deployment
        shell: cmd
        env:
          N100_SAFE_DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
          N100_SAFE_DEPLOY_SERVICES: ${{ needs.changes.outputs.services }}
        run: |
          @echo off
          if not exist "%SystemRoot%\System32\wsl.exe" exit /b 1
          set "WSLENV=N100_SAFE_DEPLOY_SHA:N100_SAFE_DEPLOY_SERVICES"
          wsl.exe -d Ubuntu-24.04 -- bash -lc "cd /mnt/c/personal-server && bash ./scripts/deploy-n100-safe.sh \"$N100_SAFE_DEPLOY_SHA\" \"$N100_SAFE_DEPLOY_SERVICES\""
          if errorlevel 1 exit /b 1
