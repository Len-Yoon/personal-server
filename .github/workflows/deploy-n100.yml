name: Deploy N100

permissions:
  contents: read

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

jobs:
  changes:
    name: Detect deployable runtime changes
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    outputs:
      runtime: ${{ steps.runtime.outputs.runtime }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 2
      - id: runtime
        shell: bash
        run: |
          if git diff --quiet HEAD^ HEAD -- \
            docker-compose.yml docker-compose.n100.yml \
            scripts/deploy-n100.sh caddy/ \
            portal-web/ system-agent/ crawler-worker/ youtube-memo/ \
            book-memo/ car-care-worker/ homeops-executor/; then
            echo "runtime=false" >> "$GITHUB_OUTPUT"
          else
            echo "runtime=true" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      needs.changes.outputs.runtime == 'true'
    needs: changes
    runs-on: [self-hosted, Windows, X64]
    concurrency:
      group: deploy-n100-${{ github.ref }}
      cancel-in-progress: false

    steps:
      - name: Verify N100 deployment directory
        shell: cmd
        run: |
          @echo off
          set "PROJECT_ROOT=C:\personal-server"
          whoami
          if not exist "%PROJECT_ROOT%\.git" exit /b 1
          if not exist "%PROJECT_ROOT%\.env" exit /b 1
          if not exist "%PROJECT_ROOT%\data" exit /b 1
          if not exist "%PROJECT_ROOT%\docker-compose.yml" exit /b 1
          if not exist "%PROJECT_ROOT%\docker-compose.n100.yml" exit /b 1

      - name: Run deployment script
        shell: cmd
        run: |
          @echo off
          if not exist "%SystemRoot%\System32\wsl.exe" exit /b 1
          wsl.exe -d Ubuntu-24.04 -- bash -lc "cd /mnt/c/personal-server && bash ./scripts/deploy-n100.sh"
          if errorlevel 1 exit /b 1

      - name: Verify deployed service health
        shell: cmd
        run: |
          @echo off
          wsl.exe -d Ubuntu-24.04 -- bash -lc "cd /mnt/c/personal-server && bash ./scripts/verify-n100-deployment-health.sh"
          if errorlevel 1 exit /b 1
