name: Public Portal Uptime Monitor

permissions:
  issues: write

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: public-uptime-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - id: health
        name: Check public service health
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          failed_services=()
          check_health() {
            local service="$1"
            local url="$2"
            if ! curl --fail --silent --show-error --max-time 20 "$url" >/dev/null; then
              failed_services+=("$service")
              printf 'Public health check failed: %s\n' "$service" >&2
            fi
          }

          check_health "portal" "https://len.pe.kr/health"
          check_health "news" "https://news.len.pe.kr/health"
          check_health "youtube_memo" "https://memo.len.pe.kr/health"
          check_health "book_memo" "https://books.len.pe.kr/health"

          if ((${#failed_services[@]} > 0)); then
            (IFS=,; printf 'failed_services=%s\n' "${failed_services[*]}") >> "$GITHUB_OUTPUT"
            exit 1
          fi

      - id: incident
        name: Find a pending health-state transition
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const incidentTitle = "[SRE] len.pe.kr 공개 상태 장애";
            const downSentMarker = "<!-- uptime-down-telegram:sent -->";
            const affectedServicesMarker = "<!-- uptime-affected-services: ";
            const state = "${{ steps.health.outcome }}";
            const failedServices = "${{ steps.health.outputs.failed_services }}";
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              per_page: 100,
            });
            const incident = issues.find((issue) =>
              !issue.pull_request &&
              issue.user?.login === "github-actions[bot]" &&
              issue.title === incidentTitle
            );

            if (state === "failure") {
              const existingMatch = (incident?.body || "").match(/<!-- uptime-affected-services: ([a-z_,]+) -->/);
              const affectedServiceSet = new Set([
                ...(existingMatch ? existingMatch[1].split(",") : []),
                ...failedServices.split(","),
              ]);
              const affectedServices = [...affectedServiceSet].filter(Boolean).join(",");
              const affectedServicesEvidence = `${affectedServicesMarker}${affectedServices} -->`;
              const incidentBody = incident
                ? (incident.body || "").match(/<!-- uptime-affected-services: [a-z_,]+ -->/)
                  ? (incident.body || "").replace(/<!-- uptime-affected-services: [a-z_,]+ -->/, affectedServicesEvidence)
                  : `${incident.body || ""}\n${affectedServicesEvidence}`
                : [
                    `외부 건강 점검에서 실패한 서비스: ${affectedServices}.`,
                    affectedServicesEvidence,
                  ].join("\n");
              let activeIncident = incident;
              if (incident) {
                const currentBody = incident.body || "";
                if (currentBody !== incidentBody) {
                  activeIncident = (await github.rest.issues.update({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: incident.number,
                    body: incidentBody,
                  })).data;
                }
              } else {
                activeIncident = (await github.rest.issues.create({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  title: incidentTitle,
                  body: incidentBody,
                })).data;
              }
              core.setOutput('affected_services', affectedServices);
              if (!(activeIncident.body || "").includes(downSentMarker)) {
                core.setOutput('notification', 'down');
                core.setOutput('issue_number', String(activeIncident.number));
              }
              return;
            }

            if (state === "success" && incident && (incident.body || "").includes(downSentMarker)) {
              const affectedMatch = (incident.body || "").match(/<!-- uptime-affected-services: ([a-z_,]+) -->/);
              core.setOutput('affected_services', affectedMatch ? affectedMatch[1] : 'all_public_services');
              core.setOutput('notification', 'recovered');
              core.setOutput('issue_number', String(incident.number));
            }

            if (state === "success" && incident && !(incident.body || "").includes(downSentMarker)) {
              const currentBody = incident.body || "";
              const evidence = "알림 미전송: 다운 상태 Telegram 전송 증적이 없어 복구 알림을 생략함";
              const body = currentBody.includes(evidence) ? currentBody : `${currentBody}\n${evidence}`;
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: incident.number,
                body,
                state: "closed",
              });
            }

      - id: telegram
        name: Send Telegram status transition
        if: steps.incident.outputs.notification != ''
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.UPTIME_TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.UPTIME_TELEGRAM_CHAT_ID }}
          NOTIFICATION: ${{ steps.incident.outputs.notification }}
          FAILED_SERVICES: ${{ steps.incident.outputs.affected_services }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$TELEGRAM_BOT_TOKEN" || -z "$TELEGRAM_CHAT_ID" ]]; then
            printf '%s\n' 'Telegram notification secrets are not configured; skipping delivery.' >&2
            printf 'delivery=unavailable\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          telegram_response="$(mktemp)"
          trap 'rm -f "$telegram_response"' EXIT
          record_delivery_failure() {
            printf 'delivery=failed\n' >> "$GITHUB_OUTPUT"
          }
          service_name() {
            case "$1" in
              portal) printf "%s" "Portal (len.pe.kr)" ;;
              news) printf "%s" "News Hub (news.len.pe.kr)" ;;
              youtube_memo) printf "%s" "YouTube Memo (memo.len.pe.kr)" ;;
              book_memo) printf "%s" "Book Memo (books.len.pe.kr)" ;;
              all_public_services) printf "%s" "전체 공개 서비스" ;;
              *) printf "%s" "확인 대상 서비스" ;;
            esac
          }
          format_affected_services() {
            local raw="$1" item label
            local -a labels=()
            IFS=',' read -r -a items <<< "$raw"
            for item in "${items[@]}"; do
              label="$(service_name "$item")"
              labels+=("$label")
            done
            (IFS=', '; printf '%s' "${labels[*]}")
          }
          affected_services="$(format_affected_services "$FAILED_SERVICES")"
          case "$NOTIFICATION" in
            down)
              message="$(printf '%s\n%s\n%s\n%s\n%s' \
                '[외부 장애]' \
                '문제: 공개 서비스 접속 실패' \
                '영향: 해당 서비스의 웹 기능을 사용할 수 없을 수 있음' \
                "대상: ${affected_services}" \
                '상태: 다음 외부 점검에서 복구 여부를 확인합니다.')"
              ;;
            recovered)
              message="$(printf '%s\n%s\n%s\n%s' \
                '[외부 복구]' \
                '문제: 공개 서비스 접속이 정상으로 돌아왔습니다.' \
                "대상: ${affected_services}" \
                '상태: 외부 health 응답을 확인했습니다.')"
              ;;
            *)
              printf '%s\n' 'Unknown uptime notification state.' >&2
              exit 1
              ;;
          esac
          telegram_status="$(
            curl --silent --show-error --retry 2 --max-time 20 \
              --output "$telegram_response" --write-out '%{http_code}' \
              --request POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
              --data-urlencode "text=${message}" || true
          )"
          case "$telegram_status" in
            200)
              if ! jq -e '.ok == true and (.result.message_id | numbers)' "$telegram_response" >/dev/null; then
                printf '%s\n' 'Telegram returned an invalid success response.' >&2
                record_delivery_failure
                exit 1
              fi
              printf 'accepted=true\n' >> "$GITHUB_OUTPUT"
              printf 'delivery=accepted\n' >> "$GITHUB_OUTPUT"
              ;;
            400)
              printf '%s\n' 'Telegram rejected chat configuration. Check chat ID format and bot membership.' >&2
              record_delivery_failure
              exit 1
              ;;
            401|404)
              printf '%s\n' 'Telegram rejected bot credentials.' >&2
              record_delivery_failure
              exit 1
              ;;
            403)
              printf '%s\n' 'Telegram blocked bot delivery.' >&2
              record_delivery_failure
              exit 1
              ;;
            000|'')
              printf '%s\n' 'Telegram delivery connection failed.' >&2
              record_delivery_failure
              exit 1
              ;;
            *)
              printf 'Telegram delivery failed with HTTP status %s.\n' "$telegram_status" >&2
              record_delivery_failure
              exit 1
              ;;
          esac

      - name: Confirm Telegram delivery before committing transition
        if: always() && steps.incident.outputs.notification != ''
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const notification = "${{ steps.incident.outputs.notification }}";
            const issueNumber = Number("${{ steps.incident.outputs.issue_number }}");
            const downSentMarker = "<!-- uptime-down-telegram:sent -->";
            const recoveryMarker = "<!-- uptime-recovered-telegram:accepted -->";
            const deliveryFailureMarker = "<!-- uptime-telegram-delivery:failed -->";
            const delivery = "${{ steps.telegram.outputs.delivery }}";
            const issue = await github.rest.issues.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
            });

            if (delivery === "failed" || delivery === "unavailable") {
              const currentBody = issue.data.body || "";
              const evidence = "알림 미전송: 상태 전환 Telegram 전송 증적이 없음";
              const bodyWithEvidence = currentBody.includes(evidence) ? currentBody : `${currentBody}\n${evidence}`;
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                body: bodyWithEvidence.includes(deliveryFailureMarker)
                  ? bodyWithEvidence
                  : `${bodyWithEvidence}\n${deliveryFailureMarker}`,
              });
              return;
            }

            if (delivery !== "accepted") {
              throw new Error("Unknown Telegram delivery state.");
            }

            if (notification === "down") {
              const currentBody = issue.data.body || "";
              const body = currentBody.includes(downSentMarker) ? currentBody : `${currentBody}\n${downSentMarker}`;
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                body,
              });
              return;
            }

            if (notification === "recovered") {
              const currentBody = issue.data.body || "";
              const evidence = "복구 Telegram API 요청 수락 확인됨";
              const bodyWithEvidence = currentBody.includes(evidence) ? currentBody : `${currentBody}\n${evidence}`;
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                body: bodyWithEvidence.includes(recoveryMarker) ? bodyWithEvidence : `${bodyWithEvidence}\n${recoveryMarker}`,
                state: "closed",
              });
              return;
            }

            throw new Error("Unknown uptime notification state.");
