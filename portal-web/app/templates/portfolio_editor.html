<!DOCTYPE html>
<html lang="ko">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>{{ title }}</title><link rel="stylesheet" href="/static/css/portfolio.css"></head>
<body>
<main class="editor-shell">
    <header><p class="eyebrow">PRIVATE ADMIN</p><h1>포트폴리오 편집</h1><p>Markdown으로 작성한 뒤 저장하면 공개 페이지에 반영됩니다.</p></header>
    <form method="post" action="/admin/save">
        <input type="hidden" name="expected_revision" value="{{ revision }}">
        {% if error %}<p role="alert">{{ error }}</p>{% endif %}
        <label for="content">포트폴리오 Markdown</label>
        <textarea id="content" name="content" rows="24" spellcheck="false">{{ content }}</textarea>
        {% if current_content is not none %}
        <section aria-label="저장 충돌 비교">
            <label for="server-content">서버에 저장된 최신 내용</label>
            <textarea id="server-content" rows="12" readonly>{{ current_content }}</textarea>
            <label><input type="checkbox" name="review_confirmed" value="1" required>최신 내용과 작성 중인 내용을 비교했습니다.</label>
        </section>
        {% endif %}
        <section id="portfolio-conflict" hidden aria-label="저장 충돌 비교">
            <label for="conflict-server-content">서버에 저장된 최신 내용</label>
            <textarea id="conflict-server-content" rows="12" readonly></textarea>
            <button id="portfolio-review-revision" type="button">최신 내용과 비교한 뒤 편집 계속</button>
        </section>
        <button type="submit">저장</button>
    </form>
    <section class="preview"><h2>현재 미리보기</h2><article class="portfolio-content">{{ preview }}</article></section>
</main>
<script src="/static/js/portfolio-drafts.js" defer></script>
</body>
</html>
